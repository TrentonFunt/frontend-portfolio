name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Repo branch constants
        run: bash .claude/hooks/check-repo-json.sh

      - name: HANDOFF line cap
        run: bash scripts/check-handoff-length.sh

      - name: Workflow standard drift
        env:
          STANDARD_VERSION_URL: https://raw.githubusercontent.com/eanvest-ltd/eanvest-workflow-standard/main/VERSION
          STANDARD_TOKEN: ${{ secrets.STANDARD_TOKEN }}
          # Set DRIFT_REQUIRE_FETCH=1 once STANDARD_TOKEN is configured for a private standard repo.
        run: bash .claude/hooks/check-standard-drift.sh

      - name: Drift checker tests
        run: bash .claude/hooks/check-standard-drift.test.sh

      - name: Guard tests
        run: node .claude/hooks/guard.test.mjs

      - name: Stage prompter smoke
        run: node .claude/hooks/stage.test.mjs

      - name: Advisory skip ledger
        run: bash scripts/check-advisory-skips.sh

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install gitleaks (OSS CLI)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd /tmp
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Secret scan
        run: gitleaks detect --source . --redact --exit-code 1
